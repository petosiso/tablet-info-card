name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Node.js
        uses: "actions/setup-node@v5"
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: "npm ci"

      - name: Typecheck and build
        run: "npm run check"

      - name: Verify committed bundle
        run: |
          if ! git diff --exit-code -- dist/tablet-info-card.js; then
            echo "::error::dist/tablet-info-card.js is out of date. Run npm run build and commit the generated file."
            exit 1
          fi

