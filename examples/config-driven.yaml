# Fallback style for users who prefer defining the rows directly in Lovelace.
type: custom:tablet-info-card
source: manual
entity: sun.sun
name: Sun overview
icon: mdi:white-balance-sunny
navigation_path: /lovelace/default_view
warn:
  entity: sun.sun
  state: below_horizon
height: 130
title_font_size: 16
row_font_size: 12
rows:
  - entity: sun.sun
    name: State
    warn:
      entity: sun.sun
      state: below_horizon
  - entity: sun.sun
    attribute: next_rising
    name: Next rising
  - entity: sun.sun
    attribute: next_setting
    name: Next setting
